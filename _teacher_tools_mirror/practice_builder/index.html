<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Physics Practice Set Builder</title><script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]],processEscapes:true}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script><style>
:root{--navy:#173f6d;--gold:#f7b91d;--ink:#1f2937;--muted:#64748b;--line:#d7dee8;--bg:#dfe5ec;--side:#f8fafc}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg);overflow:hidden}.top{height:64px;background:var(--navy);color:#fff;display:flex;align-items:center;padding:0 16px;gap:22px}.top strong{font-size:1.15rem}.top a{color:#fff;text-decoration:none;font-weight:850}.top .spacer{flex:1}.shell{height:calc(100vh - 64px);display:grid;grid-template-columns:430px minmax(0,1fr)}.side{background:var(--side);border-right:1px solid #cbd5e1;display:flex;flex-direction:column;min-height:0}.scroll{overflow:auto;padding:14px 10px 160px}.eyebrow{font-size:.72rem;color:#2872ad;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.h{display:flex;align-items:center;justify-content:space-between}.h h1{margin:5px 0 18px;font-size:1.35rem;color:#111827}.count{background:#e6eef7;color:var(--navy);border-radius:999px;padding:8px 11px;font-weight:900}.label{font-size:.74rem;font-weight:900;color:#52606f;text-transform:uppercase;margin:13px 0 6px}.field,.field select,.field input{width:100%}.field select,.field input{padding:10px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;font:inherit}.seg{display:grid;grid-template-columns:repeat(3,1fr)}.seg button{border:1px solid #cbd5e1;background:#fff;color:#52606f;padding:9px;font-weight:900}.seg button.active{background:var(--navy);color:#fff}.range{display:grid;grid-template-columns:1fr auto auto auto;gap:6px;align-items:center}.range input[type=range]{width:100%}.mini{border:1px solid #cbd5e1;background:#fff;color:var(--navy);border-radius:7px;padding:6px 8px;font-weight:900;cursor:pointer}.qcard{border:1px solid var(--line);border-radius:11px;background:#fff;padding:10px;margin:8px 0}.qtop{display:flex;align-items:center;gap:7px}.qtop strong{color:var(--navy)}.qtop .spacer{flex:1}.summary{font-size:.74rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:3px 0 8px}.inst{display:grid;grid-template-columns:1fr auto;gap:6px}.inst select{width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:7px}.bottom{position:absolute;left:0;bottom:0;width:430px;background:#f8fafc;border-top:1px solid #cbd5e1;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.bottom button,.bottom a{min-height:54px;border-radius:10px;font-weight:900;font-size:1rem;display:grid;place-items:center;text-decoration:none;cursor:pointer}.save{background:#fff;color:var(--navy);border:1px solid #cbd5e1}.publish{background:var(--gold);color:var(--navy);border:1px solid #d79d00}.open{grid-column:1/-1;background:var(--navy);color:#fff;border:1px solid var(--navy)}.work{overflow:auto;padding:12px 26px 60px}.preview-head{font-weight:900;color:#334155;margin:0 0 16px}.paper{width:8.5in;min-height:11in;background:#fff;margin:0 auto 24px;padding:.55in .58in;box-shadow:0 3px 18px rgba(0,0,0,.12)}.paper h1{font-size:19pt;margin:0 0 6px;border-bottom:2px solid #111;padding-bottom:8px}.student-line{display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px;margin:14px 0}.student-line span{display:inline-block;border-bottom:1px solid #666;width:70%}.problem{border-top:1px solid #dde3ea;padding:11px 0}.problem:first-of-type{border-top:0}.qnum{font-weight:900;color:var(--navy);margin-right:7px}.workspace{border-bottom:1px solid #edf1f5;background:repeating-linear-gradient(to bottom,transparent 0,transparent 27px,#edf1f5 28px);}.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;place-items:center;z-index:20}.modal.show{display:grid}.dialog{width:min(850px,calc(100% - 30px));background:#fff;border-radius:14px;padding:16px}.dialog textarea{width:100%;min-height:220px;font:14px/1.45 ui-monospace,monospace;padding:10px}.dialog .row{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}@media(max-width:900px){body{overflow:auto}.shell{height:auto;display:block}.side{border:0}.bottom{position:static;width:auto}.work{padding:10px}.paper{width:100%;min-height:auto}}
</style></head><body><header class="top"><strong>Physics Tools</strong><span>Practice Set Builder</span><div class="spacer"></div><a href="/library/?type=practice_sets">Library</a><a href="/planner/">Planner</a></header><div class="shell"><aside class="side"><div class="scroll"><div class="eyebrow">CPM Builder Controls</div><div class="h"><h1>Practice Sets</h1><span id="count" class="count"></span></div><div class="label">Section</div><div class="field"><select id="section"></select></div><div class="label">Document title</div><div class="field"><input id="title"></div><div class="label">Spacing</div><div class="seg" id="spacing"><button data-v="compact">Compact</button><button data-v="normal">Normal</button><button data-v="roomy">Roomy</button></div><div class="label">Page margins</div><div class="seg" id="margins"><button data-v="narrow">Narrow</button><button data-v="normal">Normal</button><button data-v="wide">Wide</button></div><div class="label">Whole document figure width</div><div class="range"><input id="fig" type="range" min="0" max="704" step="10"><output id="figOut"></output><button id="figMinus" class="mini">−</button><button id="figPlus" class="mini">+</button></div><div class="label">Whole document question workspace</div><div class="range"><input id="ws" type="range" min="0" max="5" step=".25"><output id="wsOut"></output><button id="wsMinus" class="mini">−</button><button id="wsPlus" class="mini">+</button></div><label style="display:block;margin:12px 0"><input id="showTitle" type="checkbox"> Show document title</label><div class="h" style="margin-top:18px"><div class="label" style="margin:0">Selected Questions</div><button id="addQ" class="mini">+ Add</button></div><div id="questions"></div></div><div class="bottom"><button id="save" class="save">Save Draft</button><button id="publish" class="publish">Publish Student Page</button><a id="open" class="open" target="_blank">Open Student Page ↗</a></div></aside><main class="work"><div class="preview-head">Letter page preview <span id="pages"></span></div><div id="paper" class="paper"></div></main></div><div id="modal" class="modal"><div class="dialog"><h3 id="modalTitle">Edit question</h3><textarea id="editHtml"></textarea><div class="row"><button id="cancelEdit" class="mini">Cancel</button><button id="applyEdit" class="mini">Apply</button></div></div></div><script>
const $=id=>document.getElementById(id);let cfg=null,sections=[],editIndex=-1;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function active(q){q.instances=q.instances?.length?q.instances:[{label:'Original',html:''}];q.active_instance=Math.max(0,Math.min(Number(q.active_instance||0),q.instances.length-1));return q.instances[q.active_instance]}function syncTop(){cfg.title=$('title').value;cfg.settings.spacing=[...$('spacing').querySelectorAll('button')].find(b=>b.classList.contains('active'))?.dataset.v||'normal';cfg.settings.margins=[...$('margins').querySelectorAll('button')].find(b=>b.classList.contains('active'))?.dataset.v||'normal';cfg.settings.figure_width=Number($('fig').value);cfg.settings.workspace=Number($('ws').value);cfg.settings.show_title=$('showTitle').checked}function setSeg(id,v){[...$(id).querySelectorAll('button')].forEach(b=>b.classList.toggle('active',b.dataset.v===v))}function fill(){ $('title').value=cfg.title||'';setSeg('spacing',cfg.settings.spacing||'normal');setSeg('margins',cfg.settings.margins||'normal');$('fig').value=cfg.settings.figure_width??390;$('figOut').textContent=`${$('fig').value} px`;$('ws').value=cfg.settings.workspace??1;$('wsOut').textContent=`${$('ws').value} in`;$('showTitle').checked=cfg.settings.show_title!==false;$('count').textContent=`${cfg.questions.length} questions`;$('open').href=cfg.public_url;renderCards();renderPreview()}function cardSummary(q){const t=document.createElement('div');t.innerHTML=active(q).html;return (t.textContent||'').trim().replace(/\s+/g,' ').slice(0,52)}function renderCards(){const h=$('questions');h.innerHTML='';cfg.questions.forEach((q,i)=>{const d=document.createElement('div');d.className='qcard';d.innerHTML=`<div class="qtop"><strong>Question ${i+1}</strong><div class="spacer"></div><button class="mini edit">✎</button><button class="mini up">↑</button><button class="mini down">↓</button><button class="mini vis">${q.visible===false?'○':'●'}</button></div><div class="summary">${esc(cardSummary(q))}</div><div class="inst"><select>${q.instances.map((x,j)=>`<option value="${j}" ${j===q.active_instance?'selected':''}>${esc(x.label||`Instance ${j+1}`)}</option>`).join('')}</select><button class="mini alt">+ Alternate</button></div><div class="label" style="margin-top:9px">Figure / Workspace</div><div class="range"><input class="qfig" type="range" min="0" max="704" step="10" value="${q.figure_width??cfg.settings.figure_width}"><output>${q.figure_width??cfg.settings.figure_width} px</output><button class="mini qfminus">−</button><button class="mini qfplus">+</button></div><div class="range"><input class="qws" type="range" min="0" max="5" step=".25" value="${q.workspace??cfg.settings.workspace}"><output>${q.workspace??cfg.settings.workspace} in</output><button class="mini qwminus">−</button><button class="mini qwplus">+</button></div><label style="font-size:.78rem;color:#7a5a00"><input class="pb" type="checkbox" ${q.page_break?'checked':''}> Page break before</label>`;h.appendChild(d);d.querySelector('.edit').onclick=()=>openEdit(i);d.querySelector('.up').onclick=()=>{if(i){[cfg.questions[i-1],cfg.questions[i]]=[cfg.questions[i],cfg.questions[i-1]];fill()}};d.querySelector('.down').onclick=()=>{if(i<cfg.questions.length-1){[cfg.questions[i+1],cfg.questions[i]]=[cfg.questions[i],cfg.questions[i+1]];fill()}};d.querySelector('.vis').onclick=()=>{q.visible=q.visible===false?true:false;fill()};d.querySelector('select').onchange=e=>{q.active_instance=Number(e.target.value);fill()};d.querySelector('.alt').onclick=()=>{const a=JSON.parse(JSON.stringify(active(q)));a.label=`Alternate ${q.instances.length}`;q.instances.push(a);q.active_instance=q.instances.length-1;fill()};const bind=(sel,key,delta)=>{const el=d.querySelector(sel),out=el.nextElementSibling;el.oninput=()=>{q[key]=Number(el.value);out.textContent=`${el.value}${key==='workspace'?' in':' px'}`;renderPreview()};d.querySelector(delta<0?(key==='workspace'?'.qwminus':'.qfminus'):(key==='workspace'?'.qwplus':'.qfplus')).onclick=()=>{el.value=Math.max(Number(el.min),Math.min(Number(el.max),Number(el.value)+delta*Number(el.step)));el.oninput()}};bind('.qfig','figure_width',-1);d.querySelector('.qfplus').onclick=()=>{const e=d.querySelector('.qfig');e.value=Math.min(Number(e.max),Number(e.value)+Number(e.step));e.oninput()};bind('.qws','workspace',-1);d.querySelector('.qwplus').onclick=()=>{const e=d.querySelector('.qws');e.value=Math.min(Number(e.max),Number(e.value)+Number(e.step));e.oninput()};d.querySelector('.pb').onchange=e=>q.page_break=e.target.checked})}function openEdit(i){editIndex=i;$('modalTitle').textContent=`Edit Question ${i+1}`;$('editHtml').value=active(cfg.questions[i]).html;$('modal').classList.add('show')}function renderPreview(){if(!cfg)return;syncTop();const p=$('paper');p.style.padding=cfg.settings.margins==='narrow'?'.4in':cfg.settings.margins==='wide'?'.75in':'.55in .58in';p.innerHTML=`${cfg.settings.show_title!==false?`<h1>${esc(cfg.section)} · ${esc(cfg.title)}</h1>`:''}<div class="student-line"><div>Name <span></span></div><div>Date <span></span></div><div>Period <span></span></div></div><p style="color:#475569;font-size:10pt">Show work and use correct physics notation. Follow any directions printed with a question.</p>`;let n=0;cfg.questions.forEach(q=>{if(q.visible===false)return;n++;const d=document.createElement('section');d.className='problem';if(q.page_break)d.style.breakBefore='page';let html=active(q).html;html=html.replace(/<span class=["']qnum["'][^>]*>.*?<\/span>/is,'');html=html.replace(/<p([^>]*)>/i,`<p$1><span class="qnum">${n}.</span> `);d.innerHTML=html+`<div class="workspace" style="height:${q.workspace??cfg.settings.workspace}in"></div>`;d.querySelectorAll('img,svg').forEach(x=>{x.style.maxWidth='100%';x.style.width=`${q.figure_width??cfg.settings.figure_width}px`});p.appendChild(d)});$('pages').textContent=`${Math.max(1,Math.ceil((p.scrollHeight||1056)/1056))} pages`;if(window.MathJax?.typesetPromise)MathJax.typesetPromise([p]).catch(()=>{})}async function loadSections(){const j=await fetch('/api/practice/sections',{cache:'no-store'}).then(r=>r.json());sections=j.sections||[];$('section').innerHTML=sections.map(s=>`<option value="${s.section}">${s.section} · ${esc(s.title)}</option>`).join('');const q=new URLSearchParams(location.search).get('section');await loadSection(sections.some(x=>x.section===q)?q:sections[0]?.section)}async function loadSection(s){if(!s)return;const j=await fetch(`/api/practice/section?section=${encodeURIComponent(s)}`,{cache:'no-store'}).then(r=>r.json());cfg=j.config;$('section').value=cfg.section;history.replaceState(null,'',`?section=${cfg.section}`);fill()}async function send(path){syncTop();const j=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({config:cfg})}).then(r=>r.json());if(!j.ok)throw Error(j.error||'Save failed');cfg=j.config;fill();alert(j.message)}$('section').onchange=()=>loadSection($('section').value);$('spacing').onclick=e=>{if(e.target.dataset.v){setSeg('spacing',e.target.dataset.v);renderPreview()}};$('margins').onclick=e=>{if(e.target.dataset.v){setSeg('margins',e.target.dataset.v);renderPreview()}};$('fig').oninput=()=>{$('figOut').textContent=`${$('fig').value} px`;renderPreview()};$('ws').oninput=()=>{$('wsOut').textContent=`${$('ws').value} in`;renderPreview()};$('showTitle').onchange=renderPreview;$('figMinus').onclick=()=>{$('fig').value=Math.max(0,Number($('fig').value)-10);$('fig').oninput()};$('figPlus').onclick=()=>{$('fig').value=Math.min(704,Number($('fig').value)+10);$('fig').oninput()};$('wsMinus').onclick=()=>{$('ws').value=Math.max(0,Number($('ws').value)-.25);$('ws').oninput()};$('wsPlus').onclick=()=>{$('ws').value=Math.min(5,Number($('ws').value)+.25);$('ws').oninput()};$('save').onclick=()=>send('/api/practice/save').catch(e=>alert(e.message));$('publish').onclick=()=>send('/api/practice/publish').catch(e=>alert(e.message));$('addQ').onclick=()=>{cfg.questions.push({visible:true,workspace:cfg.settings.workspace,figure_width:cfg.settings.figure_width,page_break:false,active_instance:0,instances:[{label:'New',html:'<p>Enter the new question here.</p>'}]});fill()};$('cancelEdit').onclick=()=> $('modal').classList.remove('show');$('applyEdit').onclick=()=>{active(cfg.questions[editIndex]).html=$('editHtml').value;$('modal').classList.remove('show');fill()};loadSections().catch(e=>alert(e.message));
</script></body></html>
