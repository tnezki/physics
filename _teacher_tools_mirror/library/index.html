<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Physics Library</title><style>
:root{--navy:#173f6d;--gold:#e0bd4f;--bg:#f5f7fa;--line:#d7dee8;--muted:#64748b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:#1f2937}.wrap{width:min(1180px,calc(100% - 28px));margin:20px auto}.top{background:var(--navy);color:#fff;border-radius:16px 16px 0 0;padding:16px 18px;display:flex;align-items:center;justify-content:space-between}.top h1{margin:0;font-size:1.4rem}.nav a{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.5);border-radius:999px;padding:7px 10px;margin-left:6px;font-size:.8rem;font-weight:850}.panel{background:#fff;border:1px solid var(--line);border-top:0;padding:16px}.tabs{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}.tabs button{border:1px solid #c8d1dc;border-radius:999px;padding:8px 12px;background:#fff;color:var(--navy);font-weight:850;cursor:pointer}.tabs button.active{background:var(--navy);color:#fff}.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin:8px 0}.name{font-weight:900;color:var(--navy)}.path{color:var(--muted);font-size:.75rem;margin-top:3px}.actions{display:flex;gap:7px}.actions a{padding:7px 10px;border-radius:8px;text-decoration:none;font-weight:850;font-size:.8rem}.student{background:var(--navy);color:#fff}.edit{background:#fff4c7;color:var(--navy);border:1px solid #dfc45e}.empty{padding:28px;text-align:center;color:var(--muted)}@media(max-width:650px){.wrap{width:100%;margin:0}.top{border-radius:0}.item{grid-template-columns:1fr}.actions{flex-wrap:wrap}}
</style></head><body><div class="wrap"><header class="top"><h1>Physics Library</h1><nav class="nav"><a href="/planner/">Planner</a><a href="/">Physics Tools</a></nav></header><main class="panel"><div id="tabs" class="tabs"></div><div id="items"></div></main></div><script>
let data=null,active='practice_sets';const labels={notes:'Notes',practice_sets:'Practice Sets',warmups:'Warm-Ups',investigations:'Investigations',activities:'Activities',demo:'Demos',performance_tasks:'Performance Tasks',reviews:'Reviews'};function render(){const tabs=document.getElementById('tabs'),items=document.getElementById('items');tabs.innerHTML='';Object.keys(labels).forEach(k=>{const b=document.createElement('button');b.textContent=labels[k];b.className=k===active?'active':'';b.onclick=()=>{active=k;render()};tabs.appendChild(b)});const arr=(data?.categories?.[active]||[]);items.innerHTML='';if(!arr.length){items.innerHTML='<div class="empty">No published items found.</div>';return}arr.forEach(x=>{const d=document.createElement('div');d.className='item';d.innerHTML=`<div><div class="name">${x.title}</div><div class="path">${x.path}</div></div><div class="actions">${x.editor_url?`<a class="edit" href="${x.editor_url}">Edit</a>`:''}${x.public_url?`<a class="student" href="${x.public_url}" target="_blank">Open Student Page ↗</a>`:''}</div>`;items.appendChild(d)})}fetch('/api/library',{cache:'no-store'}).then(r=>r.json()).then(j=>{data=j;const q=new URLSearchParams(location.search).get('type');if(q&&labels[q])active=q;render()}).catch(e=>{document.getElementById('items').textContent=e})
</script></body></html>
