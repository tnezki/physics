<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Physics Warm-Up Editor</title><script>window.MathJax={tex:{inlineMath:[["$","$"]],displayMath:[["$$","$$"]],processEscapes:true}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script><style>
:root{--navy:#173f6d;--gold:#f7b91d;--ink:#1f2937;--muted:#64748b;--line:#d7dee8;--bg:#dfe5ec;--side:#f8fafc}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}.top{height:64px;background:var(--navy);color:#fff;display:flex;align-items:center;padding:0 16px;gap:22px}.top strong{font-size:1.15rem}.top a{color:#fff;text-decoration:none;font-weight:850}.top .spacer{flex:1}.shell{height:calc(100vh - 64px);display:grid;grid-template-columns:430px minmax(0,1fr)}.side{background:var(--side);border-right:1px solid #cbd5e1;display:flex;flex-direction:column;min-height:0}.scroll{overflow:auto;padding:14px 10px 160px}.eyebrow{font-size:.72rem;color:#2872ad;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.h{display:flex;justify-content:space-between;align-items:center}.h h1{font-size:1.35rem;margin:5px 0 18px}.label{font-size:.74rem;font-weight:900;color:#52606f;text-transform:uppercase;margin:13px 0 6px}.field select,.field input{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;font:inherit}.range{display:grid;grid-template-columns:1fr auto auto auto;gap:6px;align-items:center}.mini{border:1px solid #cbd5e1;background:#fff;color:var(--navy);border-radius:7px;padding:6px 8px;font-weight:900;cursor:pointer}.qcard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px;margin:8px 0}.qtop{display:flex;gap:7px;align-items:center}.qtop .spacer{flex:1}.summary{font-size:.74rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:3px 0 8px}.inst{display:grid;grid-template-columns:1fr auto;gap:6px}.inst select{padding:8px;border:1px solid #cbd5e1;border-radius:7px}.bottom{position:absolute;left:0;bottom:0;width:430px;background:#f8fafc;border-top:1px solid #cbd5e1;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.bottom button,.bottom a{min-height:54px;border-radius:10px;font-weight:900;font-size:1rem;display:grid;place-items:center;text-decoration:none}.save{background:#fff;color:var(--navy);border:1px solid #cbd5e1}.publish{background:var(--gold);color:var(--navy);border:1px solid #d79d00}.open{grid-column:1/-1;background:var(--navy);color:#fff}.work{overflow:auto;padding:12px 26px 60px}.preview-head{font-weight:900;color:#334155;margin-bottom:16px}.paper{width:8.5in;min-height:11in;background:#fff;margin:0 auto 24px;padding:.55in .58in;box-shadow:0 3px 18px rgba(0,0,0,.12)}.paper h1{font-size:18pt;margin:0 0 14px;border-bottom:2px solid #173f6d;padding-bottom:8px}.problem{border-top:1px solid #dde3ea;padding:12px 0}.problem-title{font-weight:900;color:#173f6d;font-size:1.1rem;margin-bottom:6px}.workspace{background:repeating-linear-gradient(to bottom,transparent 0,transparent 27px,#edf1f5 28px)}.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;place-items:center;z-index:20}.modal.show{display:grid}.dialog{width:min(850px,calc(100% - 30px));background:#fff;border-radius:14px;padding:16px}.dialog textarea{width:100%;min-height:220px;font:14px/1.45 ui-monospace,monospace;padding:10px}.dialog .row{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}@media(max-width:900px){body{overflow:auto}.shell{height:auto;display:block}.bottom{position:static;width:auto}.paper{width:100%;min-height:auto}}
</style></head><body><header class="top"><strong>Physics Tools</strong><span>Warm-Up Editor</span><div class="spacer"></div><a href="/library/?type=warmups">Library</a><a href="/planner/">Planner</a></header><div class="shell"><aside class="side"><div class="scroll"><div class="eyebrow">CPM Builder Controls</div><div class="h"><h1>Warm-Ups</h1></div><div class="label">Unit</div><div class="field"><select id="unit"></select></div><div class="label">Section / Day</div><div class="field"><select id="group"></select></div><div class="label">Whole document question workspace</div><div class="range"><input id="ws" type="range" min="0" max="3" step=".25"><output id="wsOut"></output><button id="minus" class="mini">−</button><button id="plus" class="mini">+</button></div><div class="h" style="margin-top:18px"><div class="label" style="margin:0">Selected Questions</div><button id="addQ" class="mini">+ Add</button></div><div id="questions"></div></div><div class="bottom"><button id="save" class="save">Save Draft</button><button id="publish" class="publish">Publish Student Page</button><a id="open" class="open" target="_blank">Open Student Page ↗</a></div></aside><main class="work"><div class="preview-head">Warm-up preview</div><div id="paper" class="paper"></div></main></div><div id="modal" class="modal"><div class="dialog"><h3 id="modalTitle">Edit question</h3><textarea id="editHtml"></textarea><div class="row"><button id="cancel" class="mini">Cancel</button><button id="apply" class="mini">Apply</button></div></div></div><script>
const $=id=>document.getElementById(id);let cfg=null,units=[],editIndex=-1;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function group(){return cfg.groups[Number($('group').value)||0]}function active(q){q.instances=q.instances?.length?q.instances:[{label:'Original',html:''}];q.active_instance=Math.max(0,Math.min(Number(q.active_instance||0),q.instances.length-1));return q.instances[q.active_instance]}function fill(){ $('ws').value=cfg.settings.workspace??.5;$('wsOut').textContent=`${$('ws').value} in`;$('open').href=cfg.public_url;$('group').innerHTML=cfg.groups.map((g,i)=>`<option value="${i}">${esc(g.label)}</option>`).join('');renderCards();renderPreview()}function renderCards(){const h=$('questions'),g=group();h.innerHTML='';if(!g)return;g.questions.forEach((q,i)=>{const t=document.createElement('div');t.innerHTML=active(q).html;const sum=(t.textContent||'').trim().replace(/\s+/g,' ').slice(0,52);const d=document.createElement('div');d.className='qcard';d.innerHTML=`<div class="qtop"><strong>Question ${i+1}</strong><div class="spacer"></div><button class="mini edit">✎</button><button class="mini up">↑</button><button class="mini down">↓</button><button class="mini vis">${q.visible===false?'○':'●'}</button></div><div class="summary">${esc(sum)}</div><div class="inst"><select>${q.instances.map((x,j)=>`<option value="${j}" ${j===q.active_instance?'selected':''}>${esc(x.label||`Instance ${j+1}`)}</option>`).join('')}</select><button class="mini alt">+ Alternate</button></div><div class="label" style="margin-top:9px">Workspace</div><div class="range"><input class="qws" type="range" min="0" max="3" step=".25" value="${q.workspace??cfg.settings.workspace}"><output>${q.workspace??cfg.settings.workspace} in</output><button class="mini qm">−</button><button class="mini qp">+</button></div>`;h.appendChild(d);d.querySelector('.edit').onclick=()=>{editIndex=i;$('editHtml').value=active(q).html;$('modalTitle').textContent=`Edit Question ${i+1}`;$('modal').classList.add('show')};d.querySelector('.up').onclick=()=>{if(i){[g.questions[i-1],g.questions[i]]=[g.questions[i],g.questions[i-1]];renderCards();renderPreview()}};d.querySelector('.down').onclick=()=>{if(i<g.questions.length-1){[g.questions[i+1],g.questions[i]]=[g.questions[i],g.questions[i+1]];renderCards();renderPreview()}};d.querySelector('.vis').onclick=()=>{q.visible=q.visible===false?true:false;renderCards();renderPreview()};d.querySelector('select').onchange=e=>{q.active_instance=Number(e.target.value);renderCards();renderPreview()};d.querySelector('.alt').onclick=()=>{const a=JSON.parse(JSON.stringify(active(q)));a.label=`Alternate ${q.instances.length}`;q.instances.push(a);q.active_instance=q.instances.length-1;renderCards();renderPreview()};const r=d.querySelector('.qws'),o=r.nextElementSibling;r.oninput=()=>{q.workspace=Number(r.value);o.textContent=`${r.value} in`;renderPreview()};d.querySelector('.qm').onclick=()=>{r.value=Math.max(0,Number(r.value)-.25);r.oninput()};d.querySelector('.qp').onclick=()=>{r.value=Math.min(3,Number(r.value)+.25);r.oninput()}})}function renderPreview(){const p=$('paper'),g=group();if(!g)return;p.innerHTML=`<h1>${esc(g.label)}</h1>`;let n=0;g.questions.forEach(q=>{if(q.visible===false)return;n++;const d=document.createElement('article');d.className='problem';d.innerHTML=`<div class="problem-title">${n}</div><div class="problem-body">${active(q).html}<div class="workspace" style="height:${q.workspace??cfg.settings.workspace}in"></div></div>`;p.appendChild(d)});if(window.MathJax?.typesetPromise)MathJax.typesetPromise([p]).catch(()=>{})}async function loadUnits(){const j=await fetch('/api/warmups/units',{cache:'no-store'}).then(r=>r.json());units=j.units||[];$('unit').innerHTML=units.map(u=>`<option value="${u.unit}">Unit ${u.unit}</option>`).join('');const q=Number(new URLSearchParams(location.search).get('unit')||units[0]?.unit);$('unit').value=String(q);await loadUnit(q)}async function loadUnit(u){const j=await fetch(`/api/warmups/unit?unit=${u}`,{cache:'no-store'}).then(r=>r.json());cfg=j.config;history.replaceState(null,'',`?unit=${u}`);fill()}async function send(path){cfg.settings.workspace=Number($('ws').value);const j=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({config:cfg})}).then(r=>r.json());if(!j.ok)throw Error(j.error||'Save failed');cfg=j.config;fill();alert(j.message)}$('unit').onchange=()=>loadUnit(Number($('unit').value));$('group').onchange=()=>{renderCards();renderPreview()};$('ws').oninput=()=>{$('wsOut').textContent=`${$('ws').value} in`;cfg.settings.workspace=Number($('ws').value);renderPreview()};$('minus').onclick=()=>{$('ws').value=Math.max(0,Number($('ws').value)-.25);$('ws').oninput()};$('plus').onclick=()=>{$('ws').value=Math.min(3,Number($('ws').value)+.25);$('ws').oninput()};$('addQ').onclick=()=>{group().questions.push({visible:true,workspace:cfg.settings.workspace,active_instance:0,instances:[{label:'New',html:'<p>Enter the new warm-up question here.</p>'}]});renderCards();renderPreview()};$('cancel').onclick=()=> $('modal').classList.remove('show');$('apply').onclick=()=>{active(group().questions[editIndex]).html=$('editHtml').value;$('modal').classList.remove('show');renderCards();renderPreview()};$('save').onclick=()=>send('/api/warmups/save').catch(e=>alert(e.message));$('publish').onclick=()=>send('/api/warmups/publish').catch(e=>alert(e.message));loadUnits().catch(e=>alert(e.message));
</script></body></html>
