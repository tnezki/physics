<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Physics Weekly Warm-Ups</title><style>body{font-family:Arial;margin:0;background:#f4f6f9;color:#1f2937}.wrap{max-width:900px;margin:30px auto;background:#fff;border:1px solid #d7dee8;border-radius:14px;padding:20px}h1{color:#173f6d}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}select,a{padding:10px;border-radius:8px;border:1px solid #cbd5e1;font:inherit}a{background:#173f6d;color:#fff;text-decoration:none;font-weight:900}.note{color:#64748b;line-height:1.45}</style></head><body><div class="wrap"><h1>Physics Weekly Warm-Ups</h1><p class="note">One week at a time. Each warm-up contains exactly three review questions: <strong>2 free-response + 1 multiple-choice</strong>. Questions come only from sections before the section scheduled for that day.</p><div class="row"><select id="week"></select><a id="open">Open Editor</a><a href="/library/?type=warmups" style="background:#fff;color:#173f6d">Library</a></div></div><script>fetch('/api/warmups/weeks',{cache:'no-store'}).then(r=>r.json()).then(j=>{const s=document.getElementById('week');s.innerHTML=(j.weeks||[]).map(w=>`<option value="${w.week_number}">Week ${w.week_number}${w.published?' · published':''}</option>`).join('');const f=()=>document.getElementById('open').href=`/warmup_builder/editor.html?week=${s.value}`;s.onchange=f;f()})</script></body></html>
