<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Physics Warm-Up Builder</title><style>body{font-family:Arial;margin:0;background:#f4f6f9;color:#1f2937}.wrap{max-width:900px;margin:30px auto;background:#fff;border:1px solid #d7dee8;border-radius:14px;padding:20px}h1{color:#173f6d}.row{display:flex;gap:10px;align-items:center}select,a{padding:10px;border-radius:8px;border:1px solid #cbd5e1;font:inherit}a{background:#173f6d;color:#fff;text-decoration:none;font-weight:900}</style></head><body><div class="wrap"><h1>Physics Warm-Up Editor</h1><p>Edit the current unit warm-up pages using the same locked left-controls / live-preview model.</p><div class="row"><select id="unit"></select><a id="open">Open Editor</a><a href="/library/?type=warmups" style="background:#fff;color:#173f6d">Library</a></div></div><script>fetch('/api/warmups/units',{cache:'no-store'}).then(r=>r.json()).then(j=>{const s=document.getElementById('unit');s.innerHTML=(j.units||[]).map(u=>`<option value="${u.unit}">Unit ${u.unit}</option>`).join('');const f=()=>document.getElementById('open').href=`/warmup_builder/editor.html?unit=${s.value}`;s.onchange=f;f()})</script></body></html>
