<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Physics Student Practice Builder</title>
<script>window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]} ,svg:{fontCache:'global'}};</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<style>:root{--navy:#1f3864;--gold:#c9a84c;--bg:#f4f6f8;--ink:#17243a;--muted:#617187;--line:#cfdae7;--pale:#f7f9fc;--good:#176b3a;--bad:#a92a22}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink)}.wrap{max-width:980px;margin:auto;padding:18px}.builder-title{margin:0 0 14px;color:var(--navy);font-size:24px}.builder-subtitle{margin:-7px 0 15px;color:var(--muted);font-size:13px;line-height:1.4}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:700px){.grid{grid-template-columns:1fr}}label.title{font-weight:800;font-size:12px;display:block;margin-bottom:6px}select{width:100%;padding:10px;border:1px solid #bcc9d8;border-radius:8px;background:#fff;font:inherit}.icans{display:grid;gap:9px}.ican{display:grid;grid-template-columns:26px 1fr;gap:8px;border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff}.ican input{width:17px;height:17px;margin-top:2px}.ican .id{font-size:11px;font-weight:800;color:var(--navy)}.ican .text{font-size:15px;font-weight:700;margin-top:2px}.small{font-size:12px;color:var(--muted);line-height:1.4}.status{padding:10px 12px;border-radius:9px;background:var(--pale);border:1px solid var(--line);font-size:12px;margin-top:10px}.status.good{background:#edf8f1;color:var(--good);border-color:#bdddc9}.status.bad{background:#fff0ef;color:var(--bad);border-color:#e8bbb7}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px;align-items:center}button{border:1px solid #aebdcd;background:#fff;color:var(--navy);border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer}button.primary{background:var(--navy);color:#fff;border-color:var(--navy)}button:disabled{opacity:.45;cursor:not-allowed}.print-link{font-weight:800;color:var(--navy);padding:9px 4px;text-decoration:underline;text-underline-offset:3px}.packet-wrap{display:none}.packet-wrap.show{display:block}.packet-toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:0 0 10px}.paper{background:#fff;color:#111;width:8.5in;max-width:100%;margin:0 auto 18px;padding:.45in .55in;box-shadow:0 2px 12px rgba(0,0,0,.12);font-family:Arial,Helvetica,sans-serif}.paper h1{font-size:20px;margin:0;color:#1f3864}.paper .meta{display:flex;justify-content:space-between;gap:12px;font-size:11px;border-bottom:1px solid #aaa;padding:6px 0 8px;margin-bottom:10px}.q{break-inside:avoid;border-top:1px solid #ccc;padding:9px 0}.q:first-of-type{border-top:0}.q p{margin:4px 0;font-size:12.5px;line-height:1.35}.q blockquote{margin:7px 14px;padding-left:10px;border-left:3px solid #bbb;font-size:12.5px}.response-surface{min-height:44px;border:0;margin-top:7px;padding:0;color:transparent;font-size:0}.key .response-surface{display:none}.answer{font-size:11.5px;background:#f6f7f9;border-left:3px solid #1f3864;padding:7px 9px;margin-top:6px}.skill-group{margin-top:13px}.skill-group:first-of-type{margin-top:8px}.skill-heading{font-size:13px;line-height:1.3;color:#1f3864;border-bottom:2px solid #1f3864;padding:0 0 5px;margin:0;break-after:avoid}.skill-heading .id{font-weight:800}.skill-heading .text{font-weight:700}.qnum{font-size:10px;font-weight:800;color:#1f3864;margin-bottom:4px}.data-table{border-collapse:collapse;margin:8px auto;font-size:11.5px}.data-table th,.data-table td{border:1px solid #777;padding:4px 10px;text-align:center}.practice-graph{display:block;width:100%;max-width:350px;height:auto;margin:7px auto 10px;background:#fff}.physics-diagram{display:block;width:100%;max-width:430px;height:auto;margin:7px auto 10px;background:#fff}.choices{margin:7px 0 5px 24px;padding-left:14px;font-size:12.5px;line-height:1.4}.choices li{margin:3px 0}
@media print{body{background:#fff}.builder,.packet-toolbar{display:none!important}.wrap{max-width:none;padding:0}.packet-wrap{display:block}.paper{box-shadow:none;margin:0;width:auto;max-width:none;padding:.35in .45in}.q{break-inside:avoid}body.print-student #studentPaper{display:block!important}body.print-student #keyPaper{display:none!important}body.print-key #studentPaper{display:none!important}body.print-key #keyPaper{display:block!important}}</style></head><body>
<div class="wrap"><section class="card builder"><h1 class="builder-title">Physics · Student Practice Builder</h1><p class="builder-subtitle">Choose the exact skills you want to practice and how many questions you want for each checked I Can.</p><div class="grid"><div><label class="title" for="unit">Unit</label><select id="unit"></select></div><div><label class="title" for="count">Questions per checked I Can</label><select id="count"><option>1</option><option>2</option><option>3</option><option>4</option><option selected>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select></div></div></section>
<section class="card builder"><h2 style="margin:0 0 10px;color:#1f3864">Choose I Can statements</h2><div id="icans" class="icans"></div><div id="status" class="status">Loading approved practice pool...</div><div class="actions"><button id="all">Select All</button><button id="clear">Clear</button><button class="primary" id="create" disabled>Create Practice</button></div></section>
<section id="packetWrap" class="packet-wrap"><div class="packet-toolbar"><button class="primary" id="printStudent">Print / Save PDF</button><a href="#" class="print-link" id="printKey">Print / Save Answer Key</a><button id="newVersion">New Version</button></div><div id="studentPaper" class="paper"></div><div id="keyPaper" class="paper key" style="display:none"></div></section></div>
<script>const unitNames={"1":"Forces, Motion, and Equilibrium","2":"Motion and Kinematics","3":"Forces and Motion","4":"Momentum and Energy","5":"Waves and Sound","6":"Light and Optics","7":"Electricity and Circuits","8":"Magnetism and Electromagnetism"};
const qs=new URLSearchParams(location.search),unitSel=document.getElementById('unit');for(let i=1;i<=8;i++)unitSel.add(new Option(`Unit ${i} · ${unitNames[i]}`,i));const requested=Number(qs.get('unit'));if(requested>=1&&requested<=8)unitSel.value=String(requested);
let pool=null,current=[];const icanHost=document.getElementById('icans'),status=document.getElementById('status'),create=document.getElementById('create');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Presentation-only MathJax repair. Practice-pool JSON remains the math/content authority.
// This moves known prose accidentally enclosed in \\( ... \\) back into prose without changing values, answers, or representations.
function normalizePracticeMath(html){
  return String(html??'').replace(/\\\((\([^()]*\))\s+is the\s+([xy])-intercept\\\)/gi,'\\($1\\) is the $2-intercept');
}
function mathSpanIssues(html){
  const issues=[];
  for(const m of String(html??'').matchAll(/\\\((.*?)\\\)/gs)){
    const body=m[1].replace(/\\text\{[^{}]*\}/g,'').replace(/\\[A-Za-z]+/g,'');
    if(/(?:\bis\s+the\b|\bbecause\b|\bexplain\b|\bintercept\b|\baxis\b|\bstudent\s+says\b)/i.test(body))issues.push(m[0]);
  }
  return issues;
}
function preparePoolMath(){
  let repairs=0;
  for(const family of pool.families||[]){
    for(const q of family.instances||[]){
      const before=String(q.student_html??'');
      const after=normalizePracticeMath(before);
      if(after!==before){q.student_html=after;repairs++}
      const issues=mathSpanIssues(q.student_html);
      if(issues.length)throw new Error(`Math formatting check failed for ${q.question_id}.`);
    }
  }
  return repairs;
}

async function load(){pool=null;current=[];icanHost.innerHTML='';create.disabled=true;document.getElementById('packetWrap').classList.remove('show');status.className='status';status.textContent='Loading approved practice pool...';const u=unitSel.value;try{const r=await fetch(`../banks/unit${u}/student_practice_pool.json`,{cache:'no-store'});if(!r.ok)throw new Error(`Unit ${u} practice pool has not been built yet.`);pool=await r.json();if(pool.status!=='APPROVED'||pool.qa!=='PASS')throw new Error(`Unit ${u} practice pool is not approved / QA PASS.`);preparePoolMath();renderIcs();applyQueryTarget();update()}catch(e){status.className='status bad';status.textContent='Practice Builder unavailable: '+e.message}}
function renderIcs(){icanHost.innerHTML=pool.i_cans.map((x,i)=>`<label class="ican"><input type="checkbox" value="${esc(x.i_can_id)}" ${i===0?'checked':''}><span><span class="id">${esc(x.i_can_id)}</span><div class="text">${esc(x.exact_text)}</div></span></label>`).join('');icanHost.querySelectorAll('input').forEach(x=>x.addEventListener('change',update))}
function applyQueryTarget(){const targets=qs.getAll('ican').flatMap(v=>v.split(',')).map(v=>v.trim()).filter(Boolean);if(!targets.length)return;let matched=0;icanHost.querySelectorAll('input').forEach(x=>{x.checked=targets.includes(x.value);if(x.checked)matched++});if(!matched){const first=icanHost.querySelector('input');if(first)first.checked=true}}
function selectedIds(){return [...icanHost.querySelectorAll('input:checked')].map(x=>x.value)}
function availableFor(id){return pool.families.filter(f=>f.i_can_id===id).reduce((n,f)=>n+(f.instances?.length||0),0)}
function update(){if(!pool)return;const ids=selectedIds(),per=+document.getElementById('count').value;const short=ids.filter(id=>availableFor(id)<per);create.disabled=!ids.length||short.length>0;status.className='status '+(ids.length&&!short.length?'good':'bad');status.textContent=!ids.length?'Choose at least one I Can.':short.length?`Not enough unique approved questions for ${short.join(', ')} at ${per} per I Can. Choose fewer questions.`:`Ready: ${ids.length} checked I Can${ids.length===1?'':'s'} × ${per} question${per===1?'':'s'} = ${ids.length*per} total question${ids.length*per===1?'':'s'}.`}
document.getElementById('count').addEventListener('change',update);document.getElementById('all').onclick=()=>{icanHost.querySelectorAll('input').forEach(x=>x.checked=true);update()};document.getElementById('clear').onclick=()=>{icanHost.querySelectorAll('input').forEach(x=>x.checked=false);update()};unitSel.addEventListener('change',load);
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function chooseForIcan(id,n){const fams=pool.families.filter(f=>f.i_can_id===id).map(f=>({f,items:shuffle(f.instances||[])})),out=[],used=new Set();let cursor=0;while(out.length<n&&fams.length){const bucket=fams[cursor%fams.length];while(bucket.items.length&&used.has(bucket.items[0].question_id))bucket.items.shift();if(bucket.items.length){const picked=bucket.items.shift();used.add(picked.question_id);out.push(picked)}cursor++;if(cursor>5000)break}return out}
function chooseSelected(ids,per){return ids.flatMap(id=>chooseForIcan(id,per))}
async function typeset(el){if(window.MathJax?.startup?.promise)await MathJax.startup.promise;if(window.MathJax?.typesetPromise){MathJax.typesetClear?.([el]);await MathJax.typesetPromise([el])}}
function buildPaper(items,key=false){let number=1;const groupOrder=pool.i_cans.filter(x=>items.some(q=>q.i_can_id===x.i_can_id));const groups=groupOrder.map(skill=>{const qq=items.filter(q=>q.i_can_id===skill.i_can_id);return `<section class="skill-group"><h2 class="skill-heading"><span class="id">${esc(skill.i_can_id)}</span> · <span class="text">${esc(skill.exact_text)}</span></h2>${qq.map(q=>`<section class="q"><div class="qnum">${number++}.</div>${q.student_html}${key?`<div class="answer"><b>Answer:</b> ${esc(q.answer)}<br><b>Solution:</b> ${esc(q.solution)}</div>`:''}</section>`).join('')}</section>`}).join('');return `<h1>Physics · Unit ${pool.unit} Practice${key?' · Answer Key':''}</h1><div class="meta"><span>Name: ______________________________</span><span>Date: ____________</span></div>${groups}`}
async function make(){const ids=selectedIds(),per=+document.getElementById('count').value;current=chooseSelected(ids,per);document.getElementById('studentPaper').innerHTML=buildPaper(current,false);document.getElementById('keyPaper').innerHTML=buildPaper(current,true);document.getElementById('packetWrap').classList.add('show');await typeset(document.getElementById('studentPaper'));await typeset(document.getElementById('keyPaper'));document.getElementById('packetWrap').scrollIntoView({behavior:'smooth'})}
create.onclick=make;document.getElementById('newVersion').onclick=make;
async function printMode(mode){if(!current.length)return;const cls=mode==='key'?'print-key':'print-student',target=document.getElementById(mode==='key'?'keyPaper':'studentPaper');document.body.classList.remove('print-key','print-student');document.body.classList.add(cls);await typeset(target);const cleanup=()=>document.body.classList.remove('print-key','print-student');window.addEventListener('afterprint',cleanup,{once:true});window.print();setTimeout(cleanup,1500)}
document.getElementById('printStudent').onclick=()=>printMode('student');document.getElementById('printKey').onclick=e=>{e.preventDefault();printMode('key')};load();</script></body></html>
