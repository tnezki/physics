<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conceptual Physics · Unit 1 Family Bank</title><script>window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script><style>
:root{--navy:#1F3864;--gold:#C9A84C;--ink:#1d2733;--muted:#5d6875;--line:#d7dee7;--bg:#f4f6f8;--card:#fff;--hi:#fff8d9}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}header{background:var(--navy);color:white;padding:24px}header h1{margin:0;font-size:28px}header p{margin:7px 0 0;max-width:1000px;line-height:1.45}.wrap{max-width:1220px;margin:20px auto;padding:0 16px 50px}.mg{background:#fff;border:1px solid var(--line);border-radius:14px;margin:0 0 22px;overflow:hidden}.mghead{background:#eef2f7;border-bottom:1px solid var(--line);padding:14px 17px}.mghead h2{margin:0;color:var(--navy);font-size:21px}.mghead p{margin:5px 0 0}.ic{padding:15px 17px;border-top:1px solid var(--line)}.ic:first-of-type{border-top:0}.ic h3{margin:0 0 11px;font-size:17px}.code{font-weight:800;color:var(--navy)}.families{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.fam{border:1px solid #ccd6e1;border-radius:11px;padding:12px;background:var(--card)}.fam h4{margin:0 0 4px;color:var(--navy)}.pill{display:inline-block;font-size:11px;font-weight:800;background:#eef4fa;border:1px solid #bfd0df;border-radius:999px;padding:3px 8px;margin-bottom:6px}.small{font-size:12px;color:var(--muted);line-height:1.45}.prompt{border-top:1px solid #e1e5ea;margin-top:9px;padding-top:9px;line-height:1.5}.rep{text-align:center;margin:8px 0}.rep svg{max-width:360px;width:100%;height:auto}.cap{font-size:11px;color:#667}.choices{margin:.45rem 0 0 1.3rem}.choices li{margin:.22rem 0}.data{border-collapse:collapse;margin:8px auto;min-width:280px}.data th,.data td{border:1px solid #9faab6;padding:5px 8px;text-align:center}.data th{background:#f0f3f6}.drawbox{height:115px;border:1.5px dashed #9aa7b5;border-radius:8px;background:#fff;margin-top:8px}.eq{text-align:center;font-size:18px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}details{margin-top:9px;border-top:1px solid #e1e5ea;padding-top:7px}summary{cursor:pointer;font-weight:700;color:#2d5f8b}.target{outline:4px solid #f1cf53;background:var(--hi)!important;scroll-margin-top:15px}@media(max-width:900px){.families{grid-template-columns:1fr}.two{grid-template-columns:1fr}}</style></head><body><header><h1>Conceptual Physics · Unit 1 Family Bank</h1><p>Teacher family matrix. 19 exact I Cans × three materially different families = 57 reusable question architectures. Each card contains one exemplar; downstream artifacts author fresh instances.</p></header><main class="wrap"><div id="content"></div></main><script>
const mgFiles=['U1-MG01','U1-MG02','U1-MG03','U1-MG04'];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){const root=document.getElementById('content'); for(const id of mgFiles){const d=await fetch(`mastery_goals/${id}.json`).then(r=>r.json()); const sec=document.createElement('section'); sec.className='mg'; sec.id=d.mastery_goal.id; let h=`<div class="mghead"><h2>${esc(d.mastery_goal.id)} · ${esc(d.mastery_goal.title)}</h2><p>${esc(d.mastery_goal.description)}</p></div>`; for(const ic of d.i_cans){h+=`<div class="ic" id="${esc(ic.i_can_id)}"><h3><span class="code">${esc(ic.i_can_id)}</span> · ${esc(ic.exact_text)}</h3><div class="families">`; for(const f of ic.families){h+=`<article class="fam" id="${esc(f.family_id)}"><div class="pill">${esc(f.label)}</div><h4>${esc(f.name)}</h4><div class="small">${esc(f.family_purpose)}</div><div class="prompt">${f.exemplar.student_html}</div><details><summary>Answer & family notes</summary><p><b>Answer:</b> ${esc(f.exemplar.answer)}</p><p><b>Solution:</b> ${esc(f.exemplar.solution)}</p><p class="small"><b>Evidence job:</b> ${esc(f.evidence_job)}<br><b>Fresh-instance rule:</b> ${esc(f.fresh_instance_rule)}</p></details></article>`} h+='</div></div>'} sec.innerHTML=h; root.appendChild(sec)} honor();}
function honor(){document.querySelectorAll('.target').forEach(x=>x.classList.remove('target')); if(!location.hash)return; const id=decodeURIComponent(location.hash.slice(1)); const el=document.getElementById(id); if(el){el.classList.add('target');setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'center'}),50)}}
window.addEventListener('hashchange',honor);load().catch(e=>document.getElementById('content').innerHTML='<p>Bank failed to load: '+esc(e.message)+'</p>');
</script></body></html>
