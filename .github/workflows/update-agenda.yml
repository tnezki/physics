name: Update Physics Agenda

on:
  workflow_dispatch:
  schedule:
    - cron: "29,59 * * * *"

permissions:
  contents: write

jobs:
  update-agenda:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install requests openpyxl

      - name: Build student agenda
        run: python agenda/build_agenda.py

      - name: Commit agenda if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agenda/index.html
          if git diff --cached --quiet; then
            echo "No agenda changes."
          else
            git commit -m "Auto-update student agenda"
            git push
          fi
