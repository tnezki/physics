     Lives at the ROOT of the physics repo — same level as index.html.
     Rename this file to anything to obscure it from students.

     All links are RELATIVE — no leading slash, no domain, no repo
     name. The file works identically:
       • locally  (python3 -m http.server from the physics folder)
       • GitHub Pages  (tnezki.github.io/physics/...)
       • any other host or folder rename

     ── HOW TO EDIT ──────────────────────────────────────────────
     1. UNIT names/titles   →  edit the `units` array in <script>
     2. SECTION titles      →  edit each section's `title` field
     3. RESOURCE links      →  update `href` values in
                                studentResources / teacherResources
     4. TOP BAR chips       →  edit the HTML "TOP RESOURCES BAR" block
     5. ASSESSMENT chips    →  edit the HTML "ASSESSMENT PLANS" block
     6. COLORS              →  edit :root variables in <style>
     ============================================================ -->

// RENDERING — no need to edit below here
// ============================================================

function buildUnit(u) {
    const metaHTML = u.meta.map(function(m) {
        const cls = m.teacher ? 'unit-meta-chip teacher' : 'unit-meta-chip';
        return '<a href="' + m.href + '" class="' + cls + '" target="_blank">' + m.label + '</a>';
    }).join(' ');

    const sectionsHTML = u.sections.map(function(sec, i) {
        return buildSection(u.id, i + 1, sec);
    }).join('');

    const block = document.createElement('div');
    block.className = 'unit-block';
    block.innerHTML =
        '<div class="unit-header" onclick="toggleUnit(this)">' +
            '<span class="unit-label">' + u.label + '</span>' +
            '<span class="unit-name">' + u.name + '</span>' +
            '<i class="ti ti-chevron-down unit-chevron"></i>' +
        '</div>' +
        '<div class="unit-collapsible">' +
            '<div class="unit-meta">' + metaHTML + '</div>' +
            '<div class="unit-body">' + sectionsHTML + '</div>' +
        '</div>';
    return block;
}

function buildSection(unitId, index, sec) {
    const num = unitId + '.' + index;

    const studentBtns = sec.studentResources.map(function(r) {
        return '<a href="' + r.href + '" class="r-btn ' + r.cls + '" target="_blank">' +
               '<i class="ti ' + r.icon + '"></i>' + r.label + '</a>';
    }).join(' ');

    const teacherBtns = sec.teacherResources.map(function(r) {
        return '<a href="' + r.href + '" class="r-btn teacher" target="_blank">' +
               '<i class="ti ' + r.icon + '"></i>' + r.label + '</a>';
    }).join(' ');

    return '<div class="section-row">' +
               '<div class="section-head" onclick="toggleSection(this)">' +
                   '<span class="section-num">' + num + '</span>' +
                   '<span class="section-title">' + sec.title + '</span>' +
                   '<i class="ti ti-chevron-down section-chevron"></i>' +
               '</div>' +
               '<div class="section-body">' +
                   '<div class="btn-row"><div class="btn-row-label">Student resources</div>' + studentBtns + '</div>' +
                   '<div class="btn-row"><div class="btn-row-label">Teacher resources</div>' + teacherBtns + '</div>' +
               '</div>' +
           '</div>';
}

function toggleUnit(header) {
    const c = header.nextElementSibling;
    const v = c.classList.toggle('open');
    header.querySelector('.unit-chevron').classList.toggle('open', v);
}

function toggleSection(header) {
    const b = header.nextElementSibling;
    const v = b.classList.toggle('open');
    header.querySelector('.section-chevron').classList.toggle('open', v);
}

const container = document.getElementById('units');
units.forEach(function(u) { container.appendChild(buildUnit(u)); });
