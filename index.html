<!DOCTYPE html>

<head>

<style>
:root{--navy:#1F3864;--gold:#C9A84C;--gold-light:#F5EDD5;--gold-mid:#e8d49a;--text:#1a1a1a;--text-muted:#555;--border:#ddd;--bg:#fff;--bg-subtle:#f7f7f5}*{box-sizing:border-box;margin:0;padding:0}body{font-family:Georgia,'Times New Roman',serif;background:var(--bg-subtle);color:var(--text);font-size:15px;line-height:1.5}.page-wrap{max-width:900px;margin:0 auto;padding:2rem 1.5rem 4rem}.page-header{border-bottom:3px solid var(--navy);padding-bottom:1rem;margin-bottom:1.5rem}.page-title{font-size:26px;font-weight:normal;color:var(--navy);letter-spacing:-.3px}.page-subtitle{font-size:13px;font-family:Arial,sans-serif;color:var(--text-muted);margin-top:4px}.resources-bar{background:var(--gold-light);border-left:4px solid var(--gold);border-radius:6px;padding:.75rem 1rem;margin-bottom:2rem}.resources-bar-label{font-size:11px;font-family:Arial,sans-serif;font-weight:bold;text-transform:uppercase;letter-spacing:.8px;color:#7a6020;margin-bottom:8px}.resources-bar-links{display:flex;flex-wrap:wrap;gap:7px}.res-chip{font-size:12px;font-family:Arial,sans-serif;color:var(--navy);text-decoration:none;background:#fff;padding:4px 11px;border-radius:20px;border:1px solid var(--gold-mid)}.res-chip:hover{background:var(--gold-mid)}.unit-block{margin-bottom:2.5rem}.unit-header{background:var(--navy);border-radius:6px 6px 0 0;padding:.65rem 1rem;display:flex;align-items:baseline;gap:10px;cursor:pointer;user-select:none}.unit-header:hover{background:#26447a}.unit-label{font-size:11px;font-family:Arial,sans-serif;font-weight:bold;text-transform:uppercase;letter-spacing:.8px;color:var(--gold);white-space:nowrap}.unit-name{font-size:16px;font-family:Georgia,serif;color:#fff;font-weight:normal;flex:1}.unit-chevron{font-size:15px;color:var(--gold);transition:transform .18s;flex-shrink:0}.unit-chevron.open{transform:rotate(180deg)}.unit-collapsible{display:none}.unit-collapsible.open{display:block}.unit-meta{background:#f0f3f8;border-left:1px solid #c5cfe0;border-right:1px solid #c5cfe0;padding:.6rem 1rem;display:flex;flex-wrap:wrap;gap:7px}.unit-meta-chip{font-size:12px;font-family:Arial,sans-serif;color:var(--navy);text-decoration:none;padding:3px 10px;border-radius:20px;background:#fff;border:1px solid #b8c5d8}.unit-meta-chip:hover{background:#dce6f5}.unit-body{border:1px solid #c5cfe0;border-top:none;border-radius:0 0 6px 6px;overflow:hidden}.section-row{border-top:1px solid var(--border)}.section-row:first-child{border-top:none}.section-head{display:flex;align-items:center;gap:10px;padding:.55rem 1rem;background:var(--bg-subtle);cursor:pointer;user-select:none}.section-head:hover{background:#eef1f7}.section-num{font-size:11px;font-family:Arial,sans-serif;font-weight:bold;color:var(--gold);background:var(--navy);padding:2px 8px;border-radius:10px;white-space:nowrap}.section-title{font-size:13px;font-family:Arial,sans-serif;color:var(--text);flex:1}.section-chevron{font-size:14px;color:var(--text-muted);transition:transform .18s;flex-shrink:0}.section-chevron.open{transform:rotate(180deg)}.section-body{display:none;padding:.6rem 1rem .75rem;background:#fff;border-top:1px solid var(--border)}.section-body.open{display:block}.btn-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.r-btn{font-size:12px;font-family:Arial,sans-serif;text-decoration:none;padding:5px 12px;border-radius:20px;border:1px solid var(--border);color:var(--text-muted);background:var(--bg-subtle);display:inline-flex;align-items:center;gap:5px}.r-btn:hover{border-color:var(--navy);color:var(--navy)}.r-btn.primary{border-color:#b8c5d8;color:var(--navy);background:#f0f3f8;font-weight:bold}.r-btn.primary:hover{background:#dce6f5}.r-btn i{font-size:13px}
</style></head>
<body><div class="page-wrap">
<div class="page-header"><div class="page-title">Physics</div><div class="page-subtitle">Manistee High School</div></div>
<div class="resources-bar"><div class="resources-bar-label">Resources</div><div class="resources-bar-links">
<a href="https://docs.google.com/document/d/1rrToxZ84-VGe-75JeIofcH6FXqdCFiE-MNlwDZNvMs4/edit?usp=sharing" class="res-chip" target="_blank">Overview</a>

<a href="misc/formula_sheet.html" class="res-chip" target="_blank">Formula Sheet</a>

</div></div>
<div id="units"></div></div>
<script>
const unitDefs=[
{n:1,name:'Forces, Motion, and Equilibrium',sections:['Thinking Like a Physicist','Forces and Newton’s First Law','Net Force and Vectors','Equilibrium and Balanced Motion','Modeling Forces in the Real World']},
{n:2,name:'Motion and Kinematics',sections:['Motion and Reference Frames','Speed and Velocity','Acceleration','Free Fall Motion','Velocity Vectors and Motion Modeling']},
{n:3,name:'Forces and Motion',sections:['Force and Acceleration','Friction and Real-World Forces','Free Fall and Nonfree Fall','Newton’s Third Law and Interactions','Projectile Motion']},
{n:4,name:'Momentum and Energy',sections:['Momentum and Impulse','Conservation of Momentum','Work and Energy','Conservation of Energy','Energy in Society']},
{n:5,name:'Waves and Sound',sections:['Vibrations and Wave Properties','Wave Interactions','Nature of Sound','Reflection, Refraction, and Resonance','Sound Interference and Beats']},
{n:6,name:'Light and Optics',sections:['Nature of Light','Reflection and Mirrors','Refraction and Total Internal Reflection','Lenses and Optical Systems','Optical Applications']},
{n:7,name:'Electricity and Circuits',sections:['Electric Charge and Forces','Electric Potential and Current','Resistance and Ohm’s Law','Power and Electrical Energy','Complex Electric Circuits']},
{n:8,name:'Magnetism and Electromagnetism',sections:['Magnetism and Magnetic Fields','Electricity and Magnetism','Electromagnets and Magnetic Forces','Generators and Alternating Current','Modern Electromagnetic Systems']}
];
function sectionResources(u,s){const stem=`u${u}_${s}`;return{title:unitDefs[u-1].sections[s-1],studentResources:[
{label:'Notes',cls:'primary',icon:'ti-notes',href:`notes/${stem}_notes/${stem}_notes.html`},
{label:'Practice Set',cls:'primary',icon:'ti-pencil',href:`practice_sets/practice_sets_${u}_${s}/practice_set_${u}_${s}.html`},
{label:'Demo',cls:'',icon:'ti-search',href:`demo/${stem}_demo/${stem}_demo.html`},
{label:'Investigation',cls:'',icon:'ti-search',href:`investigations/${stem}_investigation/${stem}_investigation.html`},
{label:'Activities',cls:'',icon:'ti-puzzle',href:`activities/${stem}_act1/${stem}_act1.html`},
{label:'Tarsia',cls:'',icon:'ti-puzzle',href:`practice_sets/practice_sets_${u}_${s}/tarsia_${u}_${s}_practice_3.txt`},
{label:'Blooket',cls:'',icon:'ti-puzzle',href:`practice_sets/practice_sets_${u}_${s}/blooket_${u}_${s}_practice_3.csv`},
{label:'Extra Practice',cls:'',icon:'ti-plus',href:`practice_sets/practice_sets_${u}_${s}/extra_practice_${u}_${s}.html`},
{label:'C.Y.U.',cls:'',icon:'ti-checkbox',href:`practice_sets/practice_sets_${u}_${s}/cyu_${u}_${s}.html`} ]}}
function unitMeta(n){const m=[];if(n===1){m.push({label:'Student Bank',href:'banks/unit1/student.html'});m.push({label:'Practice Builder',href:'practice_builder___p7r4x/student_practice_builder.html?unit=1'})}m.push({label:'Progress',href:`progress/unit_${n}_progress/unit_${n}_progress.html`},{label:'Warm Ups',href:`warmups/unit_${n}_warmups/unit_${n}_warmups.html`},{label:'Review',href:`reviews/review${n}/review_${n}.html`});return m}
const units=unitDefs.map(d=>({id:String(d.n),label:`Unit ${d.n}`,name:d.name,meta:unitMeta(d.n),sections:d.sections.map((_,i)=>sectionResources(d.n,i+1))}));
function buildUnit(u){const metaHTML=u.meta.map(m=>`<a href="${m.href}" class="unit-meta-chip" target="_blank">${m.label}</a>`).join(' ');const sectionsHTML=u.sections.map((sec,i)=>buildSection(u.id,i+1,sec)).join('');const block=document.createElement('div');block.className='unit-block';block.innerHTML=`<div class="unit-header" onclick="toggleUnit(this)"><span class="unit-label">${u.label}</span><span class="unit-name">${u.name}</span><i class="ti ti-chevron-down unit-chevron"></i></div><div class="unit-collapsible"><div class="unit-meta">${metaHTML}</div><div class="unit-body">${sectionsHTML}</div></div>`;return block}
function buildSection(unitId,index,sec){const num=unitId+'.'+index;const studentBtns=sec.studentResources.map(r=>`<a href="${r.href}" class="r-btn ${r.cls}" target="_blank"><i class="ti ${r.icon}"></i>${r.label}</a>`).join(' ');return `<div class="section-row"><div class="section-head" onclick="toggleSection(this)"><span class="section-num">${num}</span><span class="section-title">${sec.title}</span><i class="ti ti-chevron-down section-chevron"></i></div><div class="section-body"><div class="btn-row">${studentBtns}</div></div></div>`}
function toggleUnit(h){const c=h.nextElementSibling,v=c.classList.toggle('open');h.querySelector('.unit-chevron').classList.toggle('open',v)}function toggleSection(h){const b=h.nextElementSibling,v=b.classList.toggle('open');h.querySelector('.section-chevron').classList.toggle('open',v)}const host=document.getElementById('units');units.forEach(u=>host.appendChild(buildUnit(u)));
</script></body></html>
